<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="220" height="220" viewBox="0 0 220 220">
<title>River hex tile — endpoint</title>
<desc>Regular point-up hexagon, radius 100, center 110 110. Edges numbered clockwise from upper right, 0 through 5. Enable one Flow layer at a time.</desc>
<defs><marker id="arrowhead" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0,0 L 4,2.5 L 0,5 Z" fill="#12394b"/></marker></defs>
<g id="hex" inkscape:groupmode="layer" inkscape:label="Hexagon"><polygon id="hexagon" points="110.000000000,10.000000000 196.602540378,60.000000000 196.602540378,160.000000000 110.000000000,210.000000000 23.397459622,160.000000000 23.397459622,60.000000000" fill="#f5f1e5" stroke="#586777" stroke-width="1.5"/></g><g id="river" inkscape:groupmode="layer" inkscape:label="River — editable arms"><g fill="none" stroke="#3d9fc4" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"><path id="river-edge-0" d="M 110,110 L 153.301270189,35.000000000"/></g><circle id="river-center" cx="110" cy="110" r="6" fill="#3d9fc4"/></g><g id="flow-forward" inkscape:groupmode="layer" inkscape:label="Flow: edge to center (endpoint)" style="display:none"><path id="forward-arrow-edge-0" d="M 141.000000000,56.306424965 L 127.000000000,80.555136271" fill="none" stroke="#12394b" stroke-width="2.5" marker-end="url(#arrowhead)"/></g><g id="flow-reverse" inkscape:groupmode="layer" inkscape:label="Flow: center to edge (source)" style="display:none"><path id="reverse-arrow-edge-0" d="M 127.000000000,80.555136271 L 141.000000000,56.306424965" fill="none" stroke="#12394b" stroke-width="2.5" marker-end="url(#arrowhead)"/></g>
</svg>
